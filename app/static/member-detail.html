<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 프로필 - 팀플링</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/auth.js"></script>
    <style>
        .profile-container {
            max-width: 600px;
            margin: 4rem auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
        }
        .profile-header {
            background: linear-gradient(135deg, #6f42c1 0%, #a64bf4 100%);
            height: 120px;
        }
        .profile-body {
            padding: 0 2rem 3rem;
            margin-top: -60px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #fff;
            object-fit: cover;
            margin-bottom: 1.5rem;
        }
        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #212529;
        }
        .profile-org {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn-back {
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">팀플링</a>
        <div class="nav-links" id="nav-links"></div>
    </header>

    <main>
        <div class="profile-container">
            <div class="profile-header"></div>
            <div class="profile-body">
                <img id="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="profile-avatar">
                <h1 id="user-name" class="profile-name">사용자</h1>
                <p id="user-org" class="profile-org">소속 정보 없음</p>

                <p style="font-size: 0.85rem; color: #868e96; margin-top: 1rem;">
                    💬 DM은 함께 참여 중인 프로젝트 페이지의 멤버 목록에서 시작할 수 있습니다.
                </p>

                <button onclick="history.back()" class="btn-back">이전 페이지로 돌아가기</button>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetMemberId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            if (!targetMemberId) {
                alert('사용자 정보가 없습니다.');
                location.href = '/';
                return;
            }
            setupHeader();
            await loadTargetUserInfo();
        });

        function setupHeader() {
            const navLinks = document.getElementById('nav-links');
            const displayName = localStorage.getItem('user_username') || '사용자';
            const profileImg = localStorage.getItem('user_profile') && localStorage.getItem('user_profile') !== 'null'
                ? localStorage.getItem('user_profile') 
                : 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

            navLinks.innerHTML = `
                <div class="user-profile-info" onclick="location.href='/static/profile.html'" style="cursor: pointer;">
                    <img src="${profileImg}" alt="profile" class="header-profile-img">
                    <span class="user-nickname">${displayName}</span>
                    <button onclick="event.stopPropagation(); logout()" style="color: #6c757d; font-size: 0.85rem; padding: 0.2rem 0.5rem; border: 1px solid #dee2e6; border-radius: 4px; margin-left: 5px;">로그아웃</button>
                </div>
            `;
        }

        async function loadTargetUserInfo() {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch(`/members/${targetMemberId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                const user = result.data;

                document.getElementById('user-name').innerText = user.username;
                document.getElementById('user-org').innerText = user.organization || '소속 정보 없음';
                if (user.profile_url) {
                    document.getElementById('user-avatar').src = user.profile_url;
                }
            } catch (e) {
                alert('사용자 정보를 불러오는데 실패했습니다.');
            }
        }

        async function loadMyProjects() {
            const token = localStorage.getItem('access_token');
            try {
                const response = await fetch('/project/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const result = await response.json();
                const projects = result.data.items;
                
                const select = document.getElementById('project-select');
                if (projects.length === 0) {
                    select.innerHTML = '<option value="" disabled>참여 중인 프로젝트가 없습니다.</option>';
                    document.getElementById('btn-start-dm').disabled = true;
                    return;
                }

                select.innerHTML = projects.map(p => `
                    <option value="${p.id}">${p.name}</option>
                `).join('');
                
            } catch (e) {
                console.error('프로젝트 목록 로드 실패', e);
            }
        }

        document.getElementById('btn-start-dm').addEventListener('click', async () => {
            const token = localStorage.getItem('access_token');
            const projectId = document.getElementById('project-select').value;
            
            try {
                const response = await fetch(`/chat/projects/${projectId}/rooms/direct`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        target_member_id: targetMemberId
                    })
                });

                const result = await response.json();
                if (response.ok) {
                    // 성공 시 해당 프로젝트 페이지의 채팅방으로 이동
                    location.href = `/static/project-detail.html?id=${projectId}&chat_room_id=${result.data.id}`;
                } else {
                    alert('채팅방 생성 실패: ' + (result.message || '오류가 발생했습니다.'));
                }
            } catch (e) {
                alert('통신 오류 발생');
            }
        });

        function logout() {
            localStorage.clear();
            location.href = '/static/index.html';
        }
    </script>
</body>
</html>
